<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>РомАренда — Аренда и доставка инструмента</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --main-yellow: #FFC107;
  --dark-yellow: #FFB300;
  --main-black: #1F1F1F;
  --light-gray: #F8F9FA;
  --white: #FFFFFF;
  --tg-blue: #0088cc;
  --radius: 12px;
}

* { box-sizing: border-box; scroll-behavior: smooth; }
body { margin:0;font-family:'Montserrat',sans-serif;background:var(--light-gray);}

header { background:#1f1f1f;color:white;padding:15px 20px;border-bottom:3px solid var(--main-yellow);}
.header-top{max-width:1200px;margin:auto;display:flex;justify-content:space-between;flex-wrap:wrap}

.logo-box{display:flex;gap:15px;color:white;text-decoration:none}
header img{height:60px;border-radius:8px}

.header-phone{text-align:right}
.header-phone a.phone-num{color:var(--main-yellow);font-size:1.3em;font-weight:900;text-decoration:none}
.header-address{color:white;font-size:0.75em}

.hero{height:450px;background:url('https://media.istockphoto.com/id/1335440179/ru/%D1%84%D0%BE%D1%82%D0%BE/%D1%8D%D0%BB%D0%B5%D0%BA%D1%82%D1%80%D0%BE%D0%B8%D0%BD%D1%81%D1%82%D1%80%D1%83%D0%BC%D0%B5%D0%BD%D1%82%D1%8B-%D0%BD%D0%B0-%D0%B4%D0%B5%D1%80%D0%B5%D0%B2%D1%8F%D0%BD%D0%BD%D0%BE%D0%BC-%D1%81%D1%82%D0%BE%D0%BB%D0%B5.jpg') center/cover;position:relative;display:flex;align-items:center;justify-content:center;color:white;text-align:center}
.hero::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.65)}
.hero-content{position:relative;z-index:2}

section{max-width:1200px;margin:60px auto;padding:0 20px}
.section-title{font-size:2em;font-weight:900;border-left:6px solid var(--main-yellow);padding-left:15px}

.search-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.search-bar input,select{padding:12px;border-radius:8px;border:1px solid #ccc}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:25px}

.card{background:white;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,.1);cursor:pointer;transition:.3s}
.card:hover{transform:translateY(-5px)}

.photo-wrapper{height:220px}
.card img{width:100%;height:100%;object-fit:cover}

.card-info{padding:20px}
.card h3{font-size:1em;height:2.6em;overflow:hidden}

.price-table{background:#f5f5f5;padding:10px;border-radius:8px;margin-bottom:10px}
.price-row{display:flex;justify-content:space-between;font-size:.85em}

button{padding:12px;border:none;border-radius:8px;font-weight:900;cursor:pointer}
.btn-cart{background:var(--main-yellow)}
.btn-click{background:#1f1f1f;color:white}

.fab{position:fixed;bottom:25px;right:25px;width:60px;height:60px;background:#25D366;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;text-decoration:none}

/* MODAL */
#descModal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:3000}
#descBox{background:white;max-width:500px;width:100%;padding:25px;border-radius:15px}
#descBox h3{margin-top:0}
</style>
</head>

<body>

<header>
<div class="header-top">
<a href="/" class="logo-box">
<img src="logo.png">
<div>
<b style="font-size:1.5em">РомАренда</b><br>
<span style="color:#FFC107;font-size:.8em">Аренда инструмента</span>
</div>
</a>
<div class="header-phone">
<a href="tel:+79152772441" class="phone-num">+7 915 277 24 41</a>
<div class="header-address">📍 Москва, Люблинская д.7/2 к.1</div>
</div>
</div>
</header>

<section class="hero">
<div class="hero-content">
<h2>АРЕНДА ИНСТРУМЕНТА <span style="color:#FFC107">БЕЗ ЗАЛОГА</span></h2>
<p>Работаем в Текстильщиках</p>
</div>
</section>

<section id="catalog">
<h2 class="section-title">Каталог оборудования</h2>
<div class="search-bar">
<input type="text" id="searchInput" placeholder="Поиск...">
<select id="catSelect"><option value="all">Все категории</option></select>
</div>
<div class="grid" id="productGrid"></div>
</section>

<a href="https://t.me/ArendMSK" class="fab">💬</a>

<!-- МОДАЛ ОПИСАНИЯ -->
<div id="descModal" onclick="closeDesc()">
<div id="descBox" onclick="event.stopPropagation()">
<h3 id="descTitle"></h3>
<p id="descText"></p>
<button onclick="closeDesc()">Закрыть</button>
</div>
</div>

<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTOtUQAhnBMNrCPWFj0u6cjQeb0qWscrovHdCWvuBQMaCCirL4ds3i6NtjqwMpcReNsrhrY_X8ICXOL/pub?gid=2109115062&single=true&output=csv";

let tools=[];

async function loadData(){
const res=await fetch(CSV_URL+"&v="+Date.now());
const data=await res.text();
const rows=data.split('\n').slice(1);

tools=rows.map(r=>{
const c=r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
if(!c[1]) return null;
return{
cat:c[0].replace(/"/g,'').trim(),
name:c[1].replace(/"/g,'').trim(),
desc:c[2].replace(/"/g,'').trim(),
img:c[3]?.trim()||'logo.png',
p1:c[4]?.trim()||'0'
};
}).filter(t=>t && t.cat && t.name);

const cats=[...new Set(tools.map(t=>t.cat))];
const select=document.getElementById('catSelect');
cats.forEach(c=>{
const o=document.createElement('option');
o.value=c;o.textContent=c;
select.appendChild(o);
});

render(tools);
}

function render(arr){
const grid=document.getElementById('productGrid');
grid.innerHTML='';
arr.forEach(t=>{
const div=document.createElement('div');
div.className='card';
div.onclick=()=>openDesc(t.name,t.desc);
div.innerHTML=`
<div class="photo-wrapper"><img src="${t.img}" onerror="this.src='logo.png'"></div>
<div class="card-info">
<h3>${t.name}</h3>
<div class="price-table">
<div class="price-row"><span>1 сутки</span><span>${t.p1} ₽</span></div>
</div>
<button class="btn-cart" onclick="event.stopPropagation()">В корзину</button>
<button class="btn-click" onclick="event.stopPropagation()">В 1 клик</button>
</div>`;
grid.appendChild(div);
});
}

function openDesc(title,text){
document.getElementById('descTitle').textContent=title;
document.getElementById('descText').textContent=text||"Описание отсутствует";
document.getElementById('descModal').style.display='flex';
}
function closeDesc(){
document.getElementById('descModal').style.display='none';
}

document.getElementById('searchInput').oninput=e=>{
const v=e.target.value.toLowerCase();
render(tools.filter(t=>t.name.toLowerCase().includes(v)));
};

document.getElementById('catSelect').onchange=e=>{
const c=e.target.value;
render(c==='all'?tools:tools.filter(t=>t.cat===c));
};

loadData();
</script>

</body>
</html>
